[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mosoro-py"
version = "0.1.0"
description = "Official Python SDK for Mosoro — the open-source communication bridge for multi-vendor robot fleets"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "Mike Stemple", email = "mike@mosoro.io"}]
dependencies = [
    "httpx>=0.27.0",
    "paho-mqtt>=2.1.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0", "respx>=0.21.0"]

[project.urls]
Homepage = "https://mosoro.io"
Repository = "https://github.com/mosoro/mosoro-py"
Documentation = "https://docs.mosoro.io"

[tool.setuptools.packages.find]
include = ["mosoro_py*"]
